name: Supabase Maintenance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set to true to apply fixes (otherwise dry-run)'
        required: false
        default: 'false'

jobs:
  fix-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (optional)
        if: ${{ github.event.inputs.run_migrations == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL not provided"; exit 1; fi
          npm run migrate:apply

      - name: Run fix_profiles_user_id (dry-run or apply)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          FIX_PROFILES_APPLY: ${{ github.event.inputs.apply }}
        run: |
          echo "FIX_PROFILES_APPLY=$FIX_PROFILES_APPLY"
          npm run fix:profiles
