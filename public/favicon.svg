<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0f172a"/>
  
  <!-- Wheat stalk center -->
  <line x1="50" y1="90" x2="50" y2="20" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Wheat grain top -->
  <ellipse cx="50" cy="20" rx="6" ry="10" fill="#fbbf24" transform="rotate(0 50 20)"/>
  
  <!-- Left grains -->
  <ellipse cx="50" cy="35" rx="5" ry="9" fill="#fbbf24" transform="rotate(-35 50 35)"/>
  <ellipse cx="50" cy="50" rx="5" ry="9" fill="#fbbf24" transform="rotate(-35 50 50)"/>
  <ellipse cx="50" cy="65" rx="5" ry="9" fill="#fbbf24" transform="rotate(-35 50 65)"/>

  <!-- Right grains -->
  <ellipse cx="50" cy="35" rx="5" ry="9" fill="#fbbf24" transform="rotate(35 50 35)"/>
  <ellipse cx="50" cy="50" rx="5" ry="9" fill="#fbbf24" transform="rotate(35 50 50)"/>
  <ellipse cx="50" cy="65" rx="5" ry="9" fill="#fbbf24" transform="rotate(35 50 65)"/>

  <!-- Green leaf left -->
  <path d="M50 72 Q30 60 25 45 Q40 55 50 72Z" fill="#10b981"/>
  <!-- Green leaf right -->
  <path d="M50 72 Q70 60 75 45 Q60 55 50 72Z" fill="#10b981"/>
</svg>
